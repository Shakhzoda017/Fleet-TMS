services:
  - type: web
    name: tms-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TMS_SECRET_KEY
        generateValue: true
      - key: TMS_ADMIN_USERNAME
        sync: false
      - key: TMS_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
